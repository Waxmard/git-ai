[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waxmard-git-ai"
version = "6.2.1"
description = "Provider-agnostic prompt/styling toolkit for LLM-powered git workflow tools (commit messages, MR descriptions)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Waxmard/git-ai"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"git_ai" = ["default-excludes.txt", "prompts/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["test/python"]

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "S",    # flake8-bandit (security)
]
ignore = [
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR2004",  # magic-value-comparison
    "S603",     # subprocess call — all invocations are trusted, list-form `git`
    "S607",     # partial executable path — `git` is intentionally resolved on PATH
]

[tool.ruff.lint.per-file-ignores]
"test/python/*" = ["S101"]  # assert is expected in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
