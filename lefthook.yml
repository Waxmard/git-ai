pre-commit:
  parallel: true
  commands:
    shell-lint:
      glob: "{bin/*,lib/*.sh}"
      run: make lint

    line-limit:
      glob: "{bin/git-ai,bin/aigit,lib/*.sh,python/git_ai/*.py,scripts/*.sh,scripts/*.py}"
      run: bash scripts/check-line-limit.sh {staged_files}

    bats:
      glob: "{bin/*,lib/*.sh,test/bin/**,test/lib/**,Makefile}"
      run: make test

    python:
      glob: "{python/**/*.py,test/python/**/*.py,pyproject.toml}"
      run: |
        set -e
        make py-format
        make py-lint
        uv run dmypy run -- python/git_ai test/python
        make py-test
      stage_fixed: true

    docs:
      glob: "{docs/src/**,scripts/build_docs.py,README.md,CLAUDE.md,AGENTS.md}"
      run: make docs-check
