name: Line limit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  line-limit:
    name: Enforce per-file line cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check source files are under the line limit
        run: bash scripts/check-line-limit.sh
