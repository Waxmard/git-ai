name: Docs

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  docs-check:
    name: Check generated docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check docs (make docs-check)
        run: make docs-check
