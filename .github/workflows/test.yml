name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run BATS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"

      - name: Install test dependencies
        run: npm ci

      - name: Install GNU parallel (enables bats --jobs)
        run: sudo apt-get update && sudo apt-get install -y parallel

      - name: Run tests
        run: make test

