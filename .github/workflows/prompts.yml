name: Prompts

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prompts-check:
    name: Check generated prompts are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check prompts (make prompts-check)
        run: make prompts-check
