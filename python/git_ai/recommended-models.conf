# git-ai recommended default models — DATA, not code.
#
# These are the default model whenever none is given and the tool has no saved
# pick, and the setup wizard's fast-path pin, both keyed by provider *family*
# below. They are SUGGESTIONS ONLY — always overridable, and not a model
# catalog (git-ai discovers the full list live from each provider's API).
#
# Bumping a model here is a routine data change. Expect commits that touch only
# this file as better models ship, e.g.:
#   chore: bump recommended anthropic model to <id>
#
# Format: one `family = model-id` per line. Blank lines and `#` comments ignored.
# Families (which providers map to which is fixed in lib/ai-common.sh):
#   anthropic   → claude-code, anthropic-api, vertex-anthropic
#   google      → gemini-api, vertex-gemini
#   openai      → openai-api, codex
#   antigravity → antigravity (own family: its ids carry an effort suffix)

anthropic   = claude-sonnet-5-5
google      = gemini-3.8-flash
openai      = gpt-6-luna
antigravity = gemini-3.8-flash-low
