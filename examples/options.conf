# git-ai options config — drop at $XDG_CONFIG_HOME/git-ai/options.conf
# (typically ~/.config/git-ai/options.conf).
#
# Each [provider] header enables that auth method. Model IDs listed under
# the header appear in `git-ai options` output and can be passed to
# `git-ai commit` / `git-ai pr`. An empty section hides that provider
# entirely. Remove this file to restore the full shipped catalog.
#
# Custom model IDs (not in the shipped catalog) are passed through to the
# provider verbatim, so you can add new releases without waiting for a
# git-ai update.
#
# Valid providers: vertex-gemini, vertex-anthropic, gemini-api, claude-code,
# anthropic-api, codex, openai-api. Unknown providers are silently ignored.

[claude-code]
claude-haiku-4-5-20251001
claude-sonnet-4-6
claude-opus-4-6

[anthropic-api]
claude-haiku-4-5-20251001
claude-sonnet-4-6

[codex]
gpt-5.4-mini
gpt-5.4

[gemini-api]
gemini-3.1-flash-lite-preview
gemini-3.1-pro-preview

# Vertex sections accept optional key=value lines (in addition to model IDs)
# to pin a GCP account/project — useful when you have multiple GCP accounts.
# These keys are not models; they're never shown in the picker.
#
#   project     = my-gcp-project   # overrides $GOOGLE_CLOUD_PROJECT/$GOOGLE_VERTEX_PROJECT
#   region      = us-east5         # overrides $VERTEX_LOCATION (default us-central1)
#   account     = me@example.com   # mint token via `gcloud auth print-access-token --account=…`
#   credentials = ~/keys/sa.json   # point ADC at a service-account JSON (~ expands to $HOME)
#
# Use account= for human Google logins (each authed once via `gcloud auth login`)
# or credentials= for service accounts. With neither, plain gcloud ADC is used.
# git-ai prints which account/project it used to stderr before each call.
#
# [vertex-anthropic]
# project = acme-prod
# account = me@acme.com
# claude-sonnet-4-6

# Empty sections — keep headers for reference but hide these providers
# from the picker.
[vertex-gemini]

[vertex-anthropic]

[openai-api]
